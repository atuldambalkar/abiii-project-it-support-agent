spring:
  application:
    name: it-support-agent

  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
      converse:
        chat:
          enabled: true
          options:
            model: ${BEDROCK_MODEL_ID:us.anthropic.claude-sonnet-4-20250514-v1:0}

server:
  port: 8080

bedrock:
  knowledge-base:
    id: ${BEDROCK_KB_ID:NGCEOIVMYF}
    data-source-id: ${BEDROCK_KB_DS_ID:VJI9ICQ42F}

agentcore:
  runtime:
    session-timeout: 86400
    max-concurrent-sessions: 100
  memory:
    short-term:
      ttl-hours: 24
    long-term:
      enabled: true
  code-interpreter:
    timeout-seconds: 30
    allowed-commands:
      - ping
      - nslookup
      - traceroute
      - certcheck
      - cert-renew

simulation:
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

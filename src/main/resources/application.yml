spring:
  application:
    name: it-support-agent

  security:
    oauth2:
      client:
        registration:
          active-directory:
            client-id: ${AD_CLIENT_ID:placeholder-ad-client-id}
            client-secret: ${AD_CLIENT_SECRET:placeholder-ad-secret}
            authorization-grant-type: client_credentials
            scope: https://graph.microsoft.com/.default
            provider: azure-ad
          servicenow:
            client-id: ${SNOW_CLIENT_ID:placeholder-snow-client-id}
            client-secret: ${SNOW_CLIENT_SECRET:placeholder-snow-secret}
            authorization-grant-type: client_credentials
            scope: useraccount
            provider: servicenow
        provider:
          azure-ad:
            token-uri: https://login.microsoftonline.com/${AD_TENANT_ID:common}/oauth2/v2.0/token
          servicenow:
            token-uri: ${SNOW_INSTANCE_URL:https://instance.service-now.com}/oauth_token.do

server:
  port: 8080

# Bedrock Knowledge Base configuration
bedrock:
  knowledge-base:
    id: ${BEDROCK_KB_ID:placeholder-kb-id}
    data-source-id: ${BEDROCK_KB_DS_ID:placeholder-ds-id}
    model-arn: arn:aws:bedrock:${AWS_REGION:us-east-1}::foundation-model/anthropic.claude-sonnet-4-20250514

management:
  endpoints:
    web:
      exposure:
        include: health,info

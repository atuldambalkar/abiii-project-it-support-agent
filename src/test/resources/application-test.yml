spring:
  security:
    oauth2:
      client:
        registration:
          active-directory:
            client-id: test-ad-client
            client-secret: test-ad-secret
            authorization-grant-type: client_credentials
            scope: https://graph.microsoft.com/.default
            provider: azure-ad
          servicenow:
            client-id: test-snow-client
            client-secret: test-snow-secret
            authorization-grant-type: client_credentials
            scope: useraccount
            provider: servicenow
        provider:
          azure-ad:
            token-uri: http://localhost:9999/oauth2/token
          servicenow:
            token-uri: http://localhost:9999/oauth_token.do
